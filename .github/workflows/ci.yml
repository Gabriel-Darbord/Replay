name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pharo:
    name: Pharo ${{ matrix.pharo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        pharo: [ 13, 14, 15 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: Pharo64-${{ matrix.pharo }}

      - name: Run tests
        run: smalltalkci -s "${{ steps.smalltalkci.outputs.smalltalk-image }}"
        shell: bash
